<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>teste de formularios</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

<label for="inome">Nome:</label>
<input type="text" name="nom" id="inome" required maxlength="30" placeholder="nome completo" autocomplete="name">

<p><label for="imedia">media:</label>
<input type="number" name="med" id="imedia" required min="0" max="10" placeholder="0 a 10" step="0.5">

<p><label for="peri">periodo:</label>
<input type="month" name="per" id="peri" value="2026-01" required>
</p>

<p><label for="prov">dia da prova:</label>
    <input type="date" name="pr" id="prov" required value="2026-01-12">
</p>


</p>

<p><input type="submit" value="enviar"></p>
<p><input type="reset" value="limpar"></p>

    </form>
</body>
</html>
