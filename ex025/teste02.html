<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>testando o que Aprendi</h1>

    <form action="cadastro.php" method="post" autocomplete="on">
      <fieldset>
        <legend>Sexo</legend>

        <input type="radio" name="sexo" id="masc" required />
        <label for="masc">Masculino:</label>

        <input type="radio" name="sexo" id="fem" />
        <label for="fem">feminino:</label>
      </fieldset>

      <fieldset>
        <legend>Dados pessoais</legend>

        <label for="inome">Nome:</label>
        <input type="text" name="non" id="inome" required /> <br />

        <label for="isen">Senha:</label>
        <input
          type="password"
          name="sen"
          id="isen"
          required
          minlength="8"
          maxlength="14"
        />
      </fieldset>
      <fieldset>
        <legend>esportes</legend>
        <input type="checkbox" name="fu" id="fut" />
        <label for="fut">futebol</label> <br />

        <input type="checkbox" name="te" id="ten" />
        <label for="ten">tenis</label>
      </fieldset>

      <p>
        <input type="submit" value="enviar" />
        <input type="reset" value="limpar" />
      </p>
    </form>
  </body>
</html>
