<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
    <h1>Tela de login</h1>
 </header>
       <main>
        <form action="cadastro.php" method="post" autocomplete="on">
               <fieldset>
                

               <label for="inome">Nome:</label>
               <input type="text" name="" id="inome" required placeholder="digite seu nome">
               <br>
               <br>

                 <label for="emal">E-mail:</label>
                 <input type="email" name="" id="emal" required placeholder="e-mail">
                 <br>
                 <br>

                  <label for="isenha">Senha:</label>
                  <input type="password" name="" id="isenha" minlength="8" maxlength="14" required placeholder="digite sua senha">
                  <p>
                    <input type="submit" value="enviar">
                    <input type="reset" value="limpar">
                  </p>

                </fieldset>
        </form>

       </main>
</body>
</html>
